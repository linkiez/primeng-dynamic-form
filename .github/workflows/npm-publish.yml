name: Publish Package to npm

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate library package
        run: npm run lint && npm run test:all

      - name: Build library package
        run: npm run build

      - name: Publish to npm (Trusted Publishing)
        run: npm publish --access public --provenance ./dist/@primeng-dynamic-form/core